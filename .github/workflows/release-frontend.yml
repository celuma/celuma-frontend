# Céluma 1.3 Phase 5, Block G-E — G-001.
#
# Production publication of the SPA, as a deliberate operator action.
#
# This used to be a side effect of pushing a `v*` tag: the tag rebuilt the SPA
# and `aws s3 sync --delete`'d it into celuma-frontend-prod, replacing what
# every user loads, with no human gate. That trigger is gone (see ci.yml).
#
# What replaces it is this workflow — nothing runs unless someone opens it,
# names an exact commit, and types the confirmation. It builds from the commit
# it is given, so what is published is traceable to a source SHA rather than to
# "whatever was on main when the tag was pushed".
name: release-frontend

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact commit on main to publish (full 40-char SHA)"
        required: true
        type: string
      confirm:
        description: 'Type PUBLISH to confirm this replaces the production SPA'
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: mx-central-1

jobs:
  publish-prod:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://app.celuma.mx

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check the confirmation
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "PUBLISH" ]; then
            echo "::error::confirmation not given — expected exactly PUBLISH"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the input to a commit object before checkout, so an ambiguous
      # ref can never decide what reaches production, and refuse anything that
      # is not on main.
      - name: Resolve and verify the commit is on main
        run: |
          set -euo pipefail
          if ! FULL_SHA="$(git rev-parse --verify --quiet "${{ inputs.sha }}^{commit}")"; then
            echo "::error::'${{ inputs.sha }}' does not resolve to a commit"
            exit 1
          fi
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$FULL_SHA" origin/main; then
            echo "::error::$FULL_SHA is not an ancestor of origin/main"
            exit 1
          fi
          echo "CELUMA_SHA=$FULL_SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      # H-0c (section 10). The release version comes from package.json — this
      # step deliberately does NOT set VITE_APP_VERSION, so there is exactly
      # one source of truth for the public release identity and no chance of
      # the workflow and the repo disagreeing. Before H-0c this plain build
      # fell back to package.json's "0.0.0", which is what production
      # displayed. Only the commit SHA is stamped here, as provenance.
      - run: npm run build
        env:
          VITE_APP_COMMIT: ${{ env.CELUMA_SHA }}

      - name: Configure AWS (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385511156241:role/GitHubActionsECSDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFront distribution id (prod)
        id: cf
        run: |
          set -euo pipefail
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='Celuma prod (SPA + /api proxy)'].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::Could not find prod CloudFront distribution"
            exit 1
          fi
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Sync to S3 (prod)
        run: |
          set -euo pipefail
          aws s3 sync dist/ s3://celuma-frontend-prod/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 cp dist/index.html s3://celuma-frontend-prod/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront (prod)
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cf.outputs.dist_id }}" \
            --paths "/index.html" "/" \
            --no-cli-pager > /dev/null

      - name: Summary
        run: |
          {
            echo "### Céluma SPA published to production"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| source commit | \`${CELUMA_SHA}\` |"
            echo "| bucket | \`celuma-frontend-prod\` |"
            echo "| distribution | \`${{ steps.cf.outputs.dist_id }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
